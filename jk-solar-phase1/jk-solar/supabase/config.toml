# Minimal Supabase CLI config for local development (`supabase start`). Run `supabase init` first if the CLI asks for more.
project_id = "jk-solar-power-energy"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = false          # admins are created by you; the public cannot register
minimum_password_length = 12

[storage]
file_size_limit = "50MiB"
